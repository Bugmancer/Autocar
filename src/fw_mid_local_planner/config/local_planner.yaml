global_frame: map
robot_frame: base_link
planning_frame: base_link

cmd_vel_topic: /cmd_vel
desired_direction_topic: /local_planner/desired_direction
plan_topic: /local_planner/global_plan
planner_service: /astar_planner_node/get_plan
goal_topic: /move_base_simple/goal
legacy_goal_topic: /goal_pose
costmap_topic: /astar_planner_node/costmap
static_map_topic: /astar_planner_node/map

control_rate: 10.0
lookahead_distance: 0.50
waypoint_tolerance: 0.20
goal_tolerance: 0.28
tracking_controller: pid

# V3 独立读取以下参数；classic/APF 不受其影响，速度上限仍来自 launch。
# 前视按弧长插值；随车速增加、随预瞄曲率缩短，单位米和秒。
v3_lookahead_min: 0.45
v3_lookahead_max: 0.80
v3_lookahead_time: 1.50
v3_lookahead_filter_time: 0.30
v3_curvature_gain: 0.70
v3_curvature_preview: 0.60
# 速度规划同时受角速度、横向加速度及剩余路程制动约束。
v3_lateral_acceleration: 0.25
v3_accel_v: 0.25
v3_accel_w: 0.40
# 行进角速度按 v * 曲率计算；此增益仅用于原地对齐。
v3_heading_gain: 1.80
# 实测角速度预估短时航向变化，并计入转向停止角；单位秒。
v3_yaw_response_time: 0.35
# 原地转向进入/退出阈值（rad），滞回避免中等转角反复停走。
v3_rotate_threshold: 1.35
v3_rotate_exit_threshold: 0.45
# 对齐后先减小实测/命令转速，再接回前行；单位 rad/s。
v3_rotate_exit_wz: 0.15
v3_goal_approach_distance: 0.60
# 斥力按矩形车身净距和固定角扇区积分，不随同一面墙的重复点数增加。
v3_obstacle_influence: 0.65
v3_repulsive_gain: 1.50
v3_tangent_gain: 0.80
# 障碍仅修正路径侧向引导，最大偏转 rad；完整碰撞检查使用原始障碍。
v3_obstacle_heading_limit: 0.20
v3_obstacle_sectors: 36
v3_side_hold_time: 1.0
v3_force_filter_time: 0.15
v3_deadband_v: 0.005
v3_deadband_w: 0.010
# 先检查正常跟踪命令，受阻后按评分顺序检查备选轨迹；无安全候选即停车。
# 时间预算在每次完整检查之间判断，不中断一次已开始的碰撞查询。
v3_trajectory_max_checks: 9
v3_trajectory_time_budget: 0.04
# 按实际沿路径前进距离判断停滞，正常原地转向另用实际航向变化识别。
v3_stall_time: 4.0
v3_stall_progress: 0.025

# APF 使用最多三个路径目标的吸引力与点云障碍斥力；经典策略忽略以下 apf_* 参数。
apf_waypoint_stride: 4
apf_near_attraction_gain: 1.50
apf_far_attraction_gain: 1.20
apf_farther_attraction_gain: 0.80
apf_repulsive_gain: 0.015
apf_obstacle_influence_distance: 0.60
apf_repulsive_max_force: 3.0
apf_max_obstacles: 300
apf_heading_gain: 1.80
# 大转角保留 apf_min_speed_scale 对应的候选速度，最终仍须通过公共碰撞检查。
apf_stop_rotate_yaw: 1.85
apf_slowdown_yaw: 1.40
apf_goal_approach_distance: 0.80
apf_min_speed_scale: 0.50
apf_min_vx: 0.08
apf_force_epsilon: 0.0001
apf_accel_limit_v: 0.50
apf_accel_limit_wz: 0.50
apf_deadband_v: 0.010
apf_deadband_wz: 0.020
# 危险净空为障碍到带余量矩形车身的距离，再减去障碍体素半径，不是到车心的距离。
# 此值控制 APF 候选速度缩放；最终命令仍需检查车身扫掠和实测制动轨迹。
apf_danger_clearance: 0.01
# 合力向量低通滤波时间常数，单位秒；0 表示禁用滤波。
apf_force_filter_time: 0.20
# 在 dynamic_obstacle_timeout 内保持完整观测权重；之后只衰减 APF 斥力。
# A* 和碰撞检查使用的障碍占用不随时间衰减。
apf_memory_decay_time: 2.0
apf_memory_min_weight: 0.25
# astar_replan 模式下，持续合力抵消超过此时间后重新请求 A*。
apf_stall_replan_time: 2.0

path_enable_shortcut: true
path_enable_smoothing: true
path_resample_ds: 0.10
path_smooth_weight_data: 0.20
path_smooth_weight_smooth: 0.35
path_smooth_max_iter: 80
path_smooth_tolerance: 0.0001
path_collision_check_step: 0.05
path_occupied_threshold: 50

pid_kp_yaw: 1.10
pid_ki_yaw: 0.00
pid_kd_yaw: 0.25
pid_kp_lateral: 0.80
pid_k_v: 0.55
pid_ki_v: 0.00
pid_kd_v: 0.00
pid_min_vx: 0.04
# 直线巡航速度和纵向上限来自 command_max_vx，即 launch 的 max_vx。
pid_max_wz: 0.22
pid_yaw_deadband: 0.035
pid_integral_limit: 0.40
pid_slowdown_yaw: 1.00
pid_stop_rotate_yaw: 1.75
pid_approach_dist: 0.80
pid_accel_limit_v: 0.25
pid_accel_limit_wz: 0.30
pid_deadband_v: 0.015
pid_deadband_wz: 0.025

pp_k_v: 0.55
pp_min_vx: 0.04
pp_max_wz: 0.22
pp_heading_gain: 0.30
pp_curvature_slowdown: 0.75
pp_approach_dist: 0.80
pp_stop_rotate_yaw: 1.85
pp_accel_limit_v: 0.25
pp_accel_limit_wz: 0.30
pp_deadband_v: 0.015
pp_deadband_wz: 0.025

enable_dynamic_obstacles: true
dynamic_cloud_topic: /fastlio2/body_cloud
dynamic_obstacle_timeout: 0.80
# 新占用点必须位于 base_link 下的此观测框内；RViz 显示框的边界。
dynamic_x_min: -1.50
dynamic_x_max: 2.50
dynamic_y_abs: 1.50
dynamic_z_min: -0.30
dynamic_z_max: 1.50
dynamic_ground_filter_enabled: true
# 转到 base_link 后滤除不高于此高度的点，单位米。
dynamic_ground_z_max: 0.12
# 每帧都处理，按点抽样降低负载，不跳过整帧。
dynamic_point_step: 3
dynamic_max_points: 1600
dynamic_cluster_distance: 0.35
# 写入记忆和膨胀前，要求同一扫描内存在足够三维邻点，计数包含自身。
# 完全重合的坐标只计一次，孤立点不写入占用。
dynamic_obstacle_support_radius: 0.15
dynamic_obstacle_support_min_points: 3

# 三维记忆仅保存在当前进程内，使用 FAST-LIO 连续世界坐标系。
dynamic_memory_frame: lidar
# 车身尺寸、余量、体素大小和碰撞采样共用下述文件，由 geometry_config 参数指定：
# fw_mid_common_utils/config/collision_geometry.yaml（路径）。
dynamic_memory_max_voxels: 60000
dynamic_memory_clear_enabled: true
dynamic_memory_clear_confirmations: 1
# 第一条有效空闲射线即可清理固定 15 cm 管道内的记忆，不递归扩散。
# 半径不得超过两倍 dynamic_memory_resolution；0 表示只沿精确射线清理。
dynamic_memory_clear_neighbor_radius: 0.15
# 仅在 confirmations > 1 时用于空闲确认，不能当作记忆过期时间。
dynamic_memory_free_confirmation_window: 1.0
dynamic_memory_endpoint_margin: 0.15
dynamic_memory_max_clear_rays: 600
# 较远的真实回波可清理旧记忆，但观测框外的回波不能写入新占用。
dynamic_max_range: 8.0
# 雷达物理光心在 /fastlio2/body_cloud 坐标系中的位置，对应 FAST-LIO 的 t_il。
dynamic_sensor_origin: [-0.011, -0.02329, 0.04412]
dynamic_self_filter_z_max: 0.65

collision_check_enabled: true
collision_speed_reduction_enabled: true
collision_require_static_map: true
collision_prediction_time: 0.8
collision_reaction_time: 0.15
collision_linear_deceleration: 0.20
collision_angular_deceleration: 0.40
start_recovery_enabled: true
# 最大恢复距离需覆盖到膨胀区外出口的搜索空间。
start_recovery_max_distance: 1.2
# 恢复使用 command_max_vx，并按该速度检查完整制动过程。

dynamic_emergency_stop: true
emergency_stop_mode: center_envelope
# 早期紧急停车包络从 base_link 原点量起；包络外仍检查完整车身扫掠和实测制动。
dynamic_center_stop_radius: 0.25
emergency_x_min: 0.00
emergency_x_max: 0.30
emergency_y_abs: 0.25

dynamic_avoidance_mode: astar_replan
# 常规障碍检测沿用碰撞检查和重规划流程；短时雷达中断的降速窗口由下方参数控制。
obstacle_slowdown_enabled: false
obstacle_slowdown_distance: 0.30
obstacle_min_speed_scale: 0.35
dynamic_degraded_motion_enabled: true
dynamic_degraded_timeout: 0.50
dynamic_degraded_speed_scale: 0.25
dynamic_detect_x_min: 0.00
dynamic_detect_x_max: 2.00
dynamic_detect_y_abs: 0.70
dynamic_min_obstacle_points: 5
dynamic_confirm_frames: 3
dynamic_center_stable_dist: 0.25
dynamic_exit_clearance: 0.30
dynamic_static_filter_enabled: true
dynamic_static_filter_radius: 0.00
dynamic_static_filter_threshold: 50

dynamic_history_publish_resolution: 0.10
dynamic_astar_replan_period: 1.00
dynamic_obstacle_update_dist: 0.30
dynamic_obstacle_points_topic: /local_planner/dynamic_obstacle_points
dynamic_keep_moving_during_replan: true
# 重规划期间保持普通跟踪限幅，每条输出命令仍须通过最终安全检查。
planner_service_timeout: 0.50
# 仅在禁用快照确认时使用，例如独立测试规划器；等待固定时间不能保证快照已经应用。
planner_overlay_settle_time: 0.03
require_overlay_ack: true
dynamic_overlay_ack_topic: /astar_planner_node/dynamic_overlay_stamp

dynamic_marker_topic: /dynamic_obstacles_markers
